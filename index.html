<!doctype html>
<html lang="en" prefix="og: https://ogp.me/ns#">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nash Magbanua — Full-Stack Developer & Operational Automation Builder</title>
    <meta
      name="description"
      content="Portfolio of Nash Magbanua: Production web applications, industrial boiler telemetry, database portals, and operational workflow software built with React, Supabase & TypeScript."
    />
    <meta name="author" content="Nash Magbanua" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#0B1E3F" />
    <link rel="canonical" href="https://aurelio-magbanua-folio.vercel.app/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Performance preloads -->
    <link rel="preload" as="image" href="/profile.jpg" fetchpriority="high" media="(min-width: 1100px)" />
    <link rel="preload" as="image" href="/og-card.jpg" fetchpriority="high" />

    <!-- Open Graph (Facebook, LinkedIn, Discord, Viber, Messenger) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nash Magbanua Portfolio" />
    <meta property="og:title" content="Nash Magbanua — Full-Stack Developer & Operational Automation Builder" />
    <meta
      property="og:description"
      content="Explore production web applications, industrial boiler tracking, and custom operational portals built with React, Supabase, and TypeScript by Nash Magbanua."
    />
    <meta property="og:url" content="https://aurelio-magbanua-folio.vercel.app/" />
    <meta property="og:image" content="https://aurelio-magbanua-folio.vercel.app/og-card.jpg" />
    <meta property="og:image:url" content="https://aurelio-magbanua-folio.vercel.app/og-card.jpg" />
    <meta property="og:image:secure_url" content="https://aurelio-magbanua-folio.vercel.app/og-card.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Nash Magbanua - Full-Stack Developer and Automation Systems Builder" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nash Magbanua — Full-Stack Developer & Operational Automation Builder" />
    <meta
      name="twitter:description"
      content="Production web applications, industrial boiler telemetry, and automated workflows built by Nash Magbanua."
    />
    <meta name="twitter:image" content="https://aurelio-magbanua-folio.vercel.app/og-card.jpg" />
    <meta name="twitter:image:alt" content="Nash Magbanua - Full-Stack Developer and Automation Systems Builder" />

    <!-- Schema.org JSON-LD structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Person",
            "@id": "https://aurelio-magbanua-folio.vercel.app/#person",
            "name": "Nash Magbanua",
            "jobTitle": "Full-Stack Developer & Operational Systems Builder",
            "description": "Designs and builds web apps, internal tools, and operational telemetry systems that eliminate bottlenecks.",
            "url": "https://aurelio-magbanua-folio.vercel.app/",
            "image": "https://aurelio-magbanua-folio.vercel.app/profile.jpg",
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Batangas",
              "addressCountry": "PH"
            },
            "sameAs": [
              "https://github.com/nashmagbanua",
              "https://www.linkedin.com/in/nash-magbanua-560077437/",
              "https://www.facebook.com/profile.php?id=61585308898126"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://aurelio-magbanua-folio.vercel.app/#website",
            "url": "https://aurelio-magbanua-folio.vercel.app/",
            "name": "Nash Magbanua Portfolio",
            "publisher": {
              "@id": "https://aurelio-magbanua-folio.vercel.app/#person"
            }
          }
        ]
      }
    </script>

    <!-- Theme before first paint: no flash of the wrong palette. -->
    <script>
      (function () {
        try {
          document.documentElement.dataset.theme =
            localStorage.getItem("theme") === "dark" ? "dark" : "light";
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
